name: LaTeX CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: latex-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare-source:
    name: Prepare source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create source archive from Git
        run: |
          git archive --format=tar --output=source.tar HEAD
          gzip source.tar

      - name: Upload source archive
        uses: actions/upload-artifact@v5
        with:
          name: source-archive
          path: source.tar.gz

  build-main:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.head_ref == 'main')
    name: Build on main
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - name: Download source archive
        uses: actions/download-artifact@v5
        with:
          name: source-archive
          path: .

      - name: Extract source
        run: |
          tar -xzf source.tar.gz

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-pictures \
            texlive-lang-french \
            biber \
            latexmk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error -synctex=1 main.tex

      - name: Upload main PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: main-thesis-pdf
          path: main.pdf
