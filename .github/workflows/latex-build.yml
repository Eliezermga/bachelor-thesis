name: LaTeX CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: latex-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  syntax-validation:
    name: Syntax & validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install lacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lacheck
          sudo rm -rf /var/lib/apt/lists/*

      - name: Run syntax validation
        run: |
          set -e
          lacheck main.tex

  security-analysis:
    name: Security analysis
    runs-on: ubuntu-latest
    needs: syntax-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run security analysis
        run: |
          set -e
          if grep -RIn --include='*.tex' '\\write18' .; then
            echo 'Found forbidden \write18 command.'
            exit 1
          fi
          echo 'No forbidden \write18 usage detected.'

  build-main:
    if: github.ref == 'refs/heads/main'
    name: Build on main
    runs-on: ubuntu-latest
    needs: security-analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-pictures \
            texlive-lang-french \
            biber \
            latexmk
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error -synctex=1 main.tex

      - name: Upload main PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: main-thesis-pdf
          path: main.pdf